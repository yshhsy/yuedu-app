<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C7BFF"/>
      <stop offset="1" stop-color="#2A3FD0"/>
    </linearGradient>
  </defs>
  <!-- 圆角方形渐变底 -->
  <rect x="10" y="10" width="492" height="492" rx="115" fill="url(#bg)"/>
  <!-- 左页 -->
  <g transform="rotate(-10 176 286)">
    <rect x="46" y="66" width="155" height="220" rx="30" fill="#ffffff"/>
    <rect x="186" y="76" width="35" height="200" rx="15" fill="rgba(20,40,120,.12)"/>
  </g>
  <!-- 右页 -->
  <g transform="rotate(10 336 286)">
    <rect x="311" y="66" width="155" height="220" rx="30" fill="#ffffff"/>
    <rect x="291" y="76" width="35" height="200" rx="15" fill="rgba(20,40,120,.12)"/>
  </g>
  <!-- 中缝（书脊） -->
  <rect x="244" y="148" width="24" height="276" rx="10" fill="rgba(30,45,120,.28)"/>
  <rect x="251" y="158" width="10" height="256" rx="5" fill="rgba(255,255,255,.35)"/>
  <!-- 经典书签（顶部橙色、底部收尖） -->
  <path d="M232 36 L280 36 L280 180 L256 212 L232 180 Z" fill="#ff9e24"/>
  <rect x="242" y="48" width="12" height="120" rx="6" fill="rgba(255,210,120,.7)"/>
</svg>
